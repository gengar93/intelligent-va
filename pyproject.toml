[project]
name = "order-support-chatbot"
version = "0.1.0"
description = "A small read-only order support chatbot proof of concept."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["order_support"]

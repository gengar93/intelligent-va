[project]
name = "order-support-assistant"
version = "0.1.0"
description = "A read-only order support assistant built incrementally."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fpdf2>=2.8.8",
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
]
